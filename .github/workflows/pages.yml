# Publishes site/ to GitHub Pages. Manual only: Pages is not enabled for this
# repository yet (it needs a public repository or a paid plan). Turn Pages on
# in Settings with "GitHub Actions" as the source, then run this workflow.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # The design mocks are one 9 MB bundle kept under docs/; copy it in at
      # deploy time instead of committing a second copy under site/.
      - name: Add the menu design mocks
        run: |
          mkdir -p site/mocks
          cp "docs/r3d/design/xbox menu/Half-Life Xbox Menu.html" site/mocks/half-life-xbox-menu.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
