// Controller defaults for the original Xbox pads.
joy_enable "1"
joy_axis_binding "sfpyrl"
joy_side "1.0"
joy_forward "1.0"
joy_yaw "100.0"
joy_pitch "100.0"

// Original Xbox pads rest well off centre: the right stick reads -5888..-7424 at rest, and below this the view
// turns by itself (docs/r3d/divergences.md #104). 8689 is XInput's XINPUT_GAMEPAD_RIGHT_THUMB_DEADZONE. It is the
// engine's own Xbox default (common/defaults.h), written out here so a settings file that sets these to 0, as a
// PC's config.cfg does, is easy to spot.
joy_side_deadzone "8689"
joy_forward_deadzone "8689"
joy_pitch_deadzone "8689"
joy_yaw_deadzone "8689"
